---
layout: default
title: Andy Damevin
---

<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md mx-auto space-y-8">

    <div class="text-center space-y-3">
      <h1 class="text-3xl font-bold tracking-tight">{cdi:links.profile.name}</h1>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">{cdi:links.profile.title}</p>
      <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{cdi:links.profile.bio}</p>
    </div>

    <div class="space-y-3">
      {#for link in cdi:links.links}
      <a href="{link.url}" target="_blank" rel="noopener noreferrer"
         class="group flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-md hover:scale-[1.02] transition-all duration-200">
        <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 group-hover:bg-gray-200 dark:group-hover:bg-gray-700 transition-colors">
          <i class="ph-fill ph-{link.icon} text-xl"></i>
        </span>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm">{link.name}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400 truncate">{link.description}</div>
        </div>
        <i class="ph ph-arrow-up-right text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition-colors"></i>
      </a>
      {/for}
    </div>

  </div>
</div>
